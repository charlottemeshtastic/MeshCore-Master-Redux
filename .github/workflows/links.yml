name: Check resource links
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'
  pull_request:
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - 'scripts/check_docs.py'
      - '.github/workflows/links.yml'
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check_docs.py
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        id: lychee
        with:
          args: --config lychee.toml README.md ATTRIBUTION.md contributing.md code-of-conduct.md 'docs/**/*.md'
          fail: false
          jobSummary: true
          output: lychee/results.md
      - name: Save dated check metadata
        if: always()
        env:
          CHECK_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          CHECKED_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p lychee
          python3 - <<'PY'
          import datetime, json, os, pathlib
          pathlib.Path('lychee/check.json').write_text(json.dumps({
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'commit': os.environ['CHECKED_COMMIT'],
              'checker_exit_code': os.environ['CHECK_EXIT_CODE'],
              'scope': 'Current resource list and reader guides; historical audits excluded',
              'limits': 'Gated social links excluded; HTTP success does not verify features'
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: link-report-${{ github.run_id }}
          path: lychee/
          retention-days: 30
      - name: Surface failed or uncertain checks
        if: always() && steps.lychee.outputs.exit_code != '0'
        run: |
          echo 'Review the link report: failures can include bot protection, timeouts, rate limits or broken links.'
          exit 1
